<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef1f5;
            color: #1f2937;
        }

        .app {
            width: 92%;
            max-width: 820px;
            height: 720px;
            margin: 35px auto;
            background: #ffffff;
            border: 1px solid #d9dee7;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            background: #17365d;
            color: white;
            padding: 20px 24px;

            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #244d7c;
            border-radius: 10px;

            font-size: 23px;
        }

        .header-text h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
        }

        .header-text p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #d7e2ef;
        }

        .online {
            margin-left: auto;
            font-size: 12px;
            color: #d7e2ef;
        }

        .online::before {
            content: "";
            display: inline-block;

            width: 8px;
            height: 8px;

            margin-right: 6px;

            background: #35b86b;
            border-radius: 50%;
        }

        /* CHAT */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f7f8fa;
        }

        .welcome {
            text-align: center;
            max-width: 600px;
            margin: 70px auto;
        }

        .welcome-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #26364a;
        }

        .welcome p {
            margin: 0 0 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .examples {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 9px;
        }

        .example {
            background: white;
            border: 1px solid #d7dce4;
            color: #344054;

            padding: 9px 13px;
            border-radius: 8px;

            cursor: pointer;
            font-size: 12px;

            transition: 0.15s;
        }

        .example:hover {
            border-color: #17365d;
            color: #17365d;
            background: #f8fafc;
        }

        /* MESSAGES */

        .message {
            display: flex;
            margin: 14px 0;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 72%;
            padding: 12px 15px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.55;

            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #17365d;
            color: white;

            border-bottom-right-radius: 3px;
        }

        .bot .bubble {
            background: white;
            color: #303846;

            border: 1px solid #dfe3e8;
            border-bottom-left-radius: 3px;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        /* INPUT */

        .input-area {
            background: white;
            border-top: 1px solid #dfe3e8;
            padding: 16px 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;

            padding: 13px 15px;

            border: 1px solid #cbd2dc;
            border-radius: 9px;

            font-size: 14px;
            outline: none;

            color: #222;
        }

        #question:focus {
            border-color: #17365d;
            box-shadow: 0 0 0 2px rgba(23, 54, 93, 0.08);
        }

        #sendButton {
            min-width: 90px;

            border: none;
            border-radius: 9px;

            background: #17365d;
            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        #sendButton:hover {
            background: #244d7c;
        }

        #sendButton:disabled {
            background: #9aa4b2;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 7px;

            font-size: 11px;
            color: #9aa1ac;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                background: white;
            }

            .app {
                width: 100%;
                height: 100vh;
                margin: 0;
                border: none;
                border-radius: 0;
            }

            .header {
                padding: 17px;
            }

            .online {
                display: none;
            }

            #chat {
                padding: 16px;
            }

            .welcome {
                margin: 45px auto;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 13px;
            }

            #sendButton {
                min-width: 75px;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">
            🤖
        </div>

        <div class="header-text">

            <h1>AI Assistant</h1>

            <p>
                Your intelligent information assistant
            </p>

        </div>

        <div class="online">
            Online
        </div>

    </div>


    <!-- CHAT -->

    <div id="chat">

        <div class="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <h2>
                How can I help you?
            </h2>

            <p>
                Ask me about scholarships, documents,
                eligibility, or any other topic.
            </p>


            <div class="examples">

                <button
                    class="example"
                    onclick="useExample('What is the scholarship amount?')">

                    Scholarship amount

                </button>


                <button
                    class="example"
                    onclick="useExample('What documents are required?')">

                    Required documents

                </button>


                <button
                    class="example"
                    onclick="useExample('Who is eligible for the scholarship?')">

                    Eligibility

                </button>


                <button
                    class="example"
                    onclick="useExample('Explain artificial intelligence in simple words.')">

                    Ask about AI

                </button>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-row">

            <input
                type="text"
                id="question"
                placeholder="Ask your question..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                onclick="askQuestion()">

                Send

            </button>

        </div>


        <div class="footer">
            AI Assistant
        </div>

    </div>

</div>


<script>

const input = document.getElementById("question");

const chat = document.getElementById("chat");

const sendButton = document.getElementById("sendButton");


/* Example question */

function useExample(question) {

    input.value = question;

    input.focus();

}


/* Enter key */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        askQuestion();

    }

});


/* Ask AI */

async function askQuestion() {

    const question = input.value.trim();

    if (!question) {

        return;

    }


    /* Remove welcome screen */

    const welcome = document.querySelector(".welcome");

    if (welcome) {

        welcome.remove();

    }


    /* User message */

    chat.innerHTML += `

        <div class="message user">

            <div class="bubble">

                ${escapeHtml(question)}

            </div>

        </div>

    `;


    input.value = "";

    sendButton.disabled = true;

    sendButton.textContent = "...";


    /* Loading message */

    const loadingId = "loading-" + Date.now();


    chat.innerHTML += `

        <div
            class="message bot"
            id="${loadingId}">

            <div class="bubble">

                Thinking...

            </div>

        </div>

    `;


    chat.scrollTop = chat.scrollHeight;


    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify({

                question: question

            })

        });


        if (!response.ok) {

            throw new Error("API request failed");

        }


        const data = await response.json();


        /* Remove loading */

        const loadingMessage =
            document.getElementById(loadingId);


        if (loadingMessage) {

            loadingMessage.remove();

        }


        /* AI response */

        chat.innerHTML += `

            <div class="message bot">

                <div class="bubble">

                    ${escapeHtml(data.answer)}

                </div>

            </div>

        `;


    } catch (error) {

        const loadingMessage =
            document.getElementById(loadingId);


        if (loadingMessage) {

            loadingMessage.remove();

        }


        chat.innerHTML += `

            <div class="message bot">

                <div class="bubble">

                    Sorry, I could not connect
                    to the AI Agent.

                </div>

            </div>

        `;

    }


    sendButton.disabled = false;

    sendButton.textContent = "Send";

    input.focus();

    chat.scrollTop = chat.scrollHeight;

}


/* Security */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
