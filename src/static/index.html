<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scholarship Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        #chat {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
        }

        input {
            width: 75%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 20%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 AI Scholarship Agent</h1>

    <div id="chat"></div>

    <input
        type="text"
        id="question"
        placeholder="Ask your scholarship question..."
    >

    <button onclick="askQuestion()">Send</button>

</div>

<script>

async function askQuestion() {

    const input = document.getElementById("question");
    const chat = document.getElementById("chat");

    const question = input.value.trim();

    if (!question) {
        return;
    }

    chat.innerHTML += `
        <div class="user">
            <b>You:</b> ${question}
        </div>
    `;

    input.value = "";

    try {

        const response = await fetch("/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        chat.innerHTML += `
            <div class="bot">
                <b>🤖 Agent:</b> ${data.answer}
            </div>
        `;

    } catch (error) {

        chat.innerHTML += `
            <div class="bot">
                <b>❌ Error:</b> Could not connect to AI Agent.
            </div>
        `;

    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
